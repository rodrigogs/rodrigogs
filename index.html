<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodrigo | Full-Stack Developer</title>
    <meta name="description" content="Rodrigo - Full-Stack Developer & Open Source Enthusiast. 15+ years building scalable web apps.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="vaporwave-bg" aria-hidden="true">
        <div class="stars-small"></div>
        <div class="stars-medium"></div>
        <div class="stars-large"></div>
        <div class="sun">
            <div class="sun-slice"></div>
            <div class="sun-slice"></div>
            <div class="sun-slice"></div>
            <div class="sun-slice"></div>
            <div class="sun-slice"></div>
        </div>
        <canvas class="blackhole-canvas" id="blackholeCanvas"></canvas>
        <div class="horizon-glow"></div>
        <div class="grid-layer"></div>
    </div>

    <header class="hero">
        <div class="hero-content">
            <h1 class="glitch" data-text="RODRIGO">RODRIGO</h1>
            <p class="subtitle">FULL-STACK DEVELOPER &bull; OPEN SOURCE ENTHUSIAST</p>
            <div class="social-links">
                <a href="https://github.com/rodrigogs" target="_blank" rel="noopener" class="neon-button">GITHUB</a>
                <a href="mailto:rodrigo.smscom@gmail.com" class="neon-button">CONTACT</a>
            </div>
        </div>
    </header>

    <nav class="sticky-nav" id="stickyNav">
        <a href="#about" class="nav-link active">ABOUT</a>
        <a href="#projects" class="nav-link">PROJECTS</a>
        <a href="#stats" class="nav-link">STATS</a>
        <a href="#skills" class="nav-link">SKILLS</a>
    </nav>

    <main>
        <section id="about" class="section reveal">
            <div class="card">
                <h2 class="section-title">ABOUT_ME</h2>
                <div class="terminal">
                    <div class="terminal-header">
                        <span class="terminal-dot red"></span>
                        <span class="terminal-dot yellow"></span>
                        <span class="terminal-dot green"></span>
                    </div>
                    <div class="terminal-body" id="terminalBody"></div>
                </div>
            </div>
        </section>

        <section id="projects" class="section reveal">
            <h2 class="section-title">FEATURED_PROJECTS</h2>
            <div class="projects-grid" id="projectsGrid"></div>
        </section>

        <section id="stats" class="section reveal">
            <h2 class="section-title">GITHUB_STATS</h2>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <span class="stat-number" data-target="85" data-suffix="+">0</span>
                    <span class="stat-label">REPOS</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" data-target="1200" data-suffix="+">0</span>
                    <span class="stat-label">TOTAL STARS</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" data-target="100" data-suffix="+">0</span>
                    <span class="stat-label">FOLLOWERS</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" data-target="15" data-suffix="+">0</span>
                    <span class="stat-label">YEARS</span>
                </div>
            </div>
        </section>

        <section id="skills" class="section reveal">
            <h2 class="section-title">TECH_ARSENAL</h2>
            <div class="skills-cloud" id="skillsCloud"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 RODRIGO &bull; BUILT WITH VAPORWAVE VIBES</p>
    </footer>

    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
    </script>
    <script src="script.js" type="module"></script>
</body>
</html>

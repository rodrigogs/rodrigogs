name: Sync profile README

# The README is generated by the site build (rodrigogs/rodrigogs.github.io)
# from the same data and design tokens as the site. This copies the latest
# generated file here once a day, committing only when it changed.

on:
  schedule:
    # One hour after the site's daily rebuild (06:17 UTC).
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the generated README
        run: curl -fsSL https://rodrigogs.github.io/readme/README.md -o README.md

      - name: Commit when it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync README from rodrigogs.github.io"
            git push
          fi
